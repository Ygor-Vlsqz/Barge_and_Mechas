<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mecha Barge</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#060911;color:#e2e8f0;font:13px system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30}
.box{background:#111827;border:1px solid #334155;border-radius:12px;padding:18px;width:min(420px,94vw);display:flex;flex-direction:column;gap:8px}
.box.wide{width:min(760px,96vw);max-height:90vh;overflow:auto}
h1{margin:0}h1 b{color:#38bdf8}h2{margin:0;color:#38bdf8}
.row{display:flex;gap:6px}.row>*{flex:1}
button,input,select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:8px;font-weight:600}
button{cursor:pointer}button:hover{background:#334155}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;font-size:12px}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:10}
#hud span{background:#0f172ae6;border:1px solid #334155;border-radius:8px;padding:5px 9px}
#prompt{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:#0f172ae6;border:1px solid #f59e0b;color:#fcd34d;border-radius:99px;padding:5px 12px;z-index:10;pointer-events:none}
#log{position:fixed;left:10px;bottom:160px;z-index:10;pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000}
#devp{position:fixed;top:56px;right:8px;width:190px;background:#111827f0;border:1px solid #f59e0b;border-radius:10px;padding:8px;z-index:35;display:flex;flex-direction:column;gap:4px;font-size:11px}
#devp button{padding:4px}
#mob{position:fixed;inset:0;z-index:15;pointer-events:none}
#joy{position:absolute;left:0;top:60px;bottom:0;width:50%;pointer-events:auto}
#joy-k{position:absolute;width:56px;height:56px;margin:-28px;border-radius:50%;background:#38bdf8aa;border:2px solid #e0f2fe;display:none}
.mb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:#1e293bcc;font-size:11px}
.mb[data-a=fire]{width:88px;height:88px;background:#be123ccc;right:20px;bottom:24px}
.mb[data-a=toggle]{right:122px;bottom:104px}.mb[data-a=pickup]{right:128px;bottom:22px}
.mb[data-a=special]{right:32px;bottom:130px}.mb[data-a=drop]{right:204px;bottom:62px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
